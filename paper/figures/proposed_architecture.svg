<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">

<defs>
<style>
.title{font:700 20px Arial, sans-serif;fill:#1f2937}.subtitle{font:12px Arial,sans-serif;fill:#4b5563}.label{font:12px Arial,sans-serif;fill:#374151}.small{font:11px Arial,sans-serif;fill:#4b5563}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.bar1{fill:#2563eb}.bar2{fill:#059669}.bar3{fill:#dc2626}.bar4{fill:#7c3aed}.box{fill:#f8fafc;stroke:#334155;stroke-width:1.5}.arrow{stroke:#334155;stroke-width:1.5;marker-end:url(#arrow)}
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
</defs>

<rect width="1120" height="640" fill="#ffffff"/>
<text x="40" y="44" class="title">Proposed C-MAPSS XAI Framework</text>
<text x="40" y="68" class="subtitle">FD001 pipeline from reproducible data processing to deep models and package-backed explanations</text>
<rect x="55" y="120" width="190" height="72" rx="6" class="box"/>
<text x="150.0" y="149" text-anchor="middle" class="label" font-weight="700">NASA CMAPSSData.zip</text>
<text x="150.0" y="172" text-anchor="middle" class="small">FD001 raw train, test, RUL</text>
<rect x="300" y="120" width="190" height="72" rx="6" class="box"/>
<text x="395.0" y="149" text-anchor="middle" class="label" font-weight="700">Validation</text>
<text x="395.0" y="172" text-anchor="middle" class="small">schema, cycles, NaN, Inf</text>
<rect x="545" y="120" width="190" height="72" rx="6" class="box"/>
<text x="640.0" y="149" text-anchor="middle" class="label" font-weight="700">Preprocessing</text>
<text x="640.0" y="172" text-anchor="middle" class="small">RUL cap, scaler, windows</text>
<rect x="790" y="120" width="250" height="72" rx="6" class="box"/>
<text x="915.0" y="149" text-anchor="middle" class="label" font-weight="700">Versioned Artifacts</text>
<text x="915.0" y="172" text-anchor="middle" class="small">Parquet, NPZ, metadata, hash</text>
<rect x="55" y="300" width="190" height="72" rx="6" class="box"/>
<text x="150.0" y="329" text-anchor="middle" class="label" font-weight="700">Predictive Models</text>
<text x="150.0" y="352" text-anchor="middle" class="small">Ridge, RF, HGB, MLP, LSTM, Transformer</text>
<rect x="300" y="300" width="190" height="72" rx="6" class="box"/>
<text x="395.0" y="329" text-anchor="middle" class="label" font-weight="700">Model Selection</text>
<text x="395.0" y="352" text-anchor="middle" class="small">RMSE, MAE, R2, NASA score</text>
<rect x="545" y="300" width="190" height="72" rx="6" class="box"/>
<text x="640.0" y="329" text-anchor="middle" class="label" font-weight="700">XAI Layer</text>
<text x="640.0" y="352" text-anchor="middle" class="small">SHAP, LIME, temporal, DiCE</text>
<rect x="790" y="300" width="250" height="72" rx="6" class="box"/>
<text x="915.0" y="329" text-anchor="middle" class="label" font-weight="700">XAI Evaluation</text>
<text x="915.0" y="352" text-anchor="middle" class="small">faithfulness, stability, robustness</text>
<rect x="300" y="495" width="190" height="72" rx="6" class="box"/>
<text x="395.0" y="524" text-anchor="middle" class="label" font-weight="700">Expert Review</text>
<text x="395.0" y="547" text-anchor="middle" class="small">maintenance usefulness protocol</text>
<rect x="545" y="495" width="250" height="72" rx="6" class="box"/>
<text x="670.0" y="524" text-anchor="middle" class="label" font-weight="700">Decision Support</text>
<text x="670.0" y="547" text-anchor="middle" class="small">risk, top sensors, maintenance window</text>
<line x1="245" y1="156" x2="300" y2="156" class="arrow"/>
<line x1="490" y1="156" x2="545" y2="156" class="arrow"/>
<line x1="735" y1="156" x2="790" y2="156" class="arrow"/>
<line x1="150" y1="192" x2="150" y2="300" class="arrow"/>
<line x1="245" y1="336" x2="300" y2="336" class="arrow"/>
<line x1="490" y1="336" x2="545" y2="336" class="arrow"/>
<line x1="735" y1="336" x2="790" y2="336" class="arrow"/>
<line x1="640" y1="372" x2="640" y2="495" class="arrow"/>
<line x1="545" y1="531" x2="490" y2="531" class="arrow"/>
<line x1="735" y1="531" x2="790" y2="336" class="arrow"/>
</svg>
