[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmapss-xai"
version = "0.1.0"
description = "Research-grade dataset foundation for NASA C-MAPSS RUL and XAI experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "kaleido>=0.2.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.22",
    "pyarrow>=15",
    "PyYAML>=6.0",
    "rich>=13.7",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "streamlit>=1.35",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
deep-xai = [
    "captum>=0.7", # Integrated Gradients for torch sequence models
    "dice-ml>=0.11", # package-backed counterfactual explanations
    "lime>=0.2.0.1", # package-backed local surrogate explanations
    "shap>=0.45", # package-backed additive attribution
    "torch>=2.3", # LSTM, GRU, and Transformer sequence models
]

[project.scripts]
cmapss-xai = "cmapss_xai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
